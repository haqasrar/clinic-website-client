<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Website Under Maintenance</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: #111;
      color: #fff;
      text-align: center;
    }
    .maintenance-box {
      padding: 2rem;
      max-width: 520px;
      width: 100%;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 18px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(8px);
    }
    h1 {
      font-size: 2.6rem;
      margin-bottom: 1rem;
    }
    p {
      font-size: 1.15rem;
      color: #d1d5db;
      line-height: 1.6;
      margin: 0;
    }
    @media (max-width: 480px) {
      .maintenance-box {
        padding: 1.5rem;
      }
      h1 { font-size: 2rem; }
      p { font-size: 1rem; }
    }
  </style>
</head>
<body>
  <div class="maintenance-box">
    <h1>🚧 Website Under Maintenance</h1>
    <p>We are currently making improvements to our site.<br>Please check back soon.</p>
  </div>
</body>
</html>
